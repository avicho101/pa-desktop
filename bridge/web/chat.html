<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pa-desktop · chat</title>
<style>
:root{--bg:#0d0f14;--bg2:#12151c;--bg3:#181c25;--bd:#232936;--bd2:#1b202a;--txt:#e7eaf3;--dim:#9aa3b5;--faint:#5f6880;--ac:#8ab4ff;--ac2:#5b8def;--grn:#34d399;--red:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Inter,Roboto,sans-serif;font-size:14px;display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--ac2),#7c5bff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0}
.brand{font-weight:700;font-size:14px}
.brand small{display:block;font-size:10px;color:var(--faint);font-weight:500}
.spacer{flex:1}
select{background:var(--bg3);color:var(--txt);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:12px;max-width:34vw;outline:none}
select:focus{border-color:var(--ac2)}
#newBtn{background:var(--ac);border:none;color:#0d0f14;font-weight:700;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
#modelBtn{background:var(--bg3);color:var(--ac);border:1px solid rgba(138,180,255,.35);border-radius:999px;padding:5px 12px;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
#gearBtn{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--dim);font-size:16px;padding:5px 9px;cursor:pointer}
#memBtn{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--dim);font-size:15px;padding:5px 9px;cursor:pointer}
#memBtn:hover,#gearBtn:hover{border-color:var(--ac2);color:var(--txt)}
#modeBtn{background:var(--bg3);border:1px solid var(--bd);border-radius:999px;color:var(--ac);font-size:11px;padding:5px 10px;cursor:pointer;font-weight:600}
#modeBtn:hover{border-color:var(--ac2)}
#messages{flex:1;overflow-y:auto;padding:14px 12px}
.msg{max-width:88%;margin:0 auto 14px}
.msg .who{font-size:11px;font-weight:700;color:var(--faint);margin-bottom:3px}
.msg .bubble{background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:10px 13px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user .bubble{background:var(--ac);border-color:var(--ac);color:#0d0f14;margin-left:auto}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .who{order:-1}
.thinking{background:var(--bg2);border-left:2px solid var(--ac2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--faint);white-space:pre-wrap;margin-bottom:6px}
.tool{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;margin-bottom:5px;display:inline-block}
.tool b{color:var(--ac)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
pre code{background:none;padding:0}
.typing{display:inline-flex;gap:4px;padding:6px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1.4s infinite both}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--bg2)}
textarea{flex:1;background:var(--bg3);color:var(--txt);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:140px}
textarea:focus{border-color:var(--ac2)}
#sendBtn{width:42px;height:42px;border-radius:12px;background:var(--ac2);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
#sendBtn:disabled{opacity:.4}
.banner{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);padding:8px 12px;font-size:13px;text-align:center}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.4);color:var(--grn);padding:8px 16px;border-radius:999px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadein .15s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:560px;max-width:94vw;max-height:86vh;background:var(--bg3);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhead{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.mhead h3{margin:0;font-size:15px}
.mclose{background:none;border:none;color:var(--faint);font-size:22px;cursor:pointer;line-height:1}
.mbody{padding:12px 16px;overflow-y:auto}
.search{width:100%;padding:9px 12px;margin-bottom:12px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;color:var(--txt);font-size:13px;outline:none}
.search:focus{border-color:var(--ac2)}
.mgroup{margin-bottom:12px}
.mglabel{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700;padding:5px 4px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.mitem:hover{background:var(--bg)}
.mitem.sel{background:rgba(138,180,255,.1);border-color:rgba(138,180,255,.3)}
.minfo{display:flex;flex-direction:column;gap:1px;min-width:0}
.mname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmeta{font-size:11px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px}
.badge.reasoning{background:rgba(138,180,255,.12);color:var(--ac)}
.badge.free{background:rgba(52,211,153,.15);color:var(--grn)}
.badge.ctx{background:var(--bg);color:var(--faint)}
.checkmark{color:var(--ac);font-weight:700}
.empty{text-align:center;color:var(--faint);padding:20px;font-size:13px}

/* ---------- settings ---------- */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd2)}
.srow:last-child{border-bottom:none}
.slabel{display:flex;flex-direction:column;gap:1px}
.sname{font-size:13px;font-weight:600}
.sdesc{font-size:11.5px;color:var(--faint);max-width:300px}
.ssection{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ac);font-weight:700;margin:14px 0 4px}
input[type="text"],input[type="number"]{background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--txt);font-size:12.5px;padding:6px 8px;outline:none;min-width:110px}
input:focus{border-color:var(--ac2)}
.sselect{max-width:46%;min-width:90px}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .sl{position:absolute;inset:0;border-radius:999px;background:var(--bd);transition:.15s}
.toggle .sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+.sl{background:var(--ac2)}
.toggle input:checked+.sl:before{transform:translateX(18px)}
.btn{background:var(--bg);border:1px solid var(--bd);color:var(--txt);border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:4px}
.btn:active{opacity:.8}
.savednote{color:var(--grn);font-size:12px;min-height:16px;margin-top:6px}
</style>
</head>
<body>
<div id="err" class="banner" style="display:none"></div>
<div id="toast" class="toast"></div>
<header>
  <div class="logo">PA</div>
  <div class="brand">pa-desktop<small>Prime Agent · web chat</small></div>
  <div class="spacer"></div>
  <select id="agentSel" title="Session"></select>
  <button id="newBtn" title="New session">+</button>
  <button id="gearBtn" title="Settings">⚙</button>
  <button id="memBtn" title="Memory & skills">🧠</button>
  <button id="modeBtn" title="Toggle highlights / full view">◉ High</button>
</header>
<div id="messages"><div style="text-align:center;color:var(--faint);padding:30px;font-size:13px">Loading sessions…</div></div>
<div class="composer">
  <button id="modelBtn" title="Choose model">◉ choose model</button>
  <textarea id="input" rows="1" placeholder="Message the agent…" disabled></textarea>
  <button id="sendBtn" disabled>↑</button>
</div>

<script>
const $=s=>document.querySelector(s);
let agentId=null, streaming=false, agentMap={}, currentModel="", viewMode="high";

const toastT=null;
function toast(m){const t=$("#toast");t.textContent="✓ "+m;t.style.opacity=1;clearTimeout(toastT);setTimeout(()=>t.style.opacity=0,1800)}
function showErr(m){const e=$("#err");if(m){e.style.display="block";e.textContent="⚠ "+m}else{e.style.display="none"}}
async function j(url,opts){const r=await fetch(url,opts);let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
async function loadAgents(selectNew){
  const d=await j("/api/agents?v="+Date.now());
  agentMap={};d.agents.forEach(a=>agentMap[a.id]=a);
  const sel=$("#agentSel");sel.innerHTML="";
  d.agents.forEach(a=>{const o=document.createElement("option");o.value=a.id;o.textContent=(a.name||a.model||a.id.slice(0,8))+(" · "+a.messages);sel.appendChild(o)});
  if(selectNew&&d.agents[0])agentId=d.agents[0].id;else if(!agentId&&d.agents[0])agentId=d.agents[0].id;
  sel.value=agentId;updateComposer();
}
function updateComposer(){
  $("#input").disabled=!agentId;$("#sendBtn").disabled=!agentId||streaming;
  if(agentMap[agentId]){currentModel=agentMap[agentId].model||"";$("#modelBtn").textContent="◉ "+(currentModel||"choose model")}
}
function renderMessage(m){
  const wrap=document.createElement("div");wrap.className="msg "+(m.role==="user"?"user":"assistant");
  const who=document.createElement("div");who.className="who";who.textContent=m.role==="user"?"You":"pa-desktop";
  wrap.appendChild(who);
  if(m.thinking&&m.thinking.trim()){const t=document.createElement("div");t.className="thinking";t.textContent="🧠 "+m.thinking;wrap.appendChild(t)}
  (m.tools||[]).forEach(t=>{const d=document.createElement("div");d.className="tool";d.innerHTML="⚙ <b>"+escapeHtml(t.name)+"</b>";wrap.appendChild(d)});
  const b=document.createElement("div");b.className="bubble";b.innerHTML=markdown(m.text||"");
  wrap.appendChild(b);$("#messages").appendChild(wrap);
}
function addTyping(){const w=document.createElement("div");w.id="typing";w.className="msg assistant";w.innerHTML='<div class="who">pa-desktop</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';$("#messages").appendChild(w);scrollB()}
function rmTyping(){const t=$("#typing");if(t)t.remove()}
function scrollB(){$("#messages").scrollTop=$("#messages").scrollHeight}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function markdown(t){
  t=escapeHtml(t);
  t=t.replace(/~~~([\s\S]*?)~~~/g,'<pre><code>$1</code></pre>');
  t=t.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>');
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/\*([^*]+)\*/g,'<i>$1</i>');
  return t;
}
async function loadMessages(){
  if(!agentId)return;
  const d=await j("/api/messages?agent="+encodeURIComponent(agentId)+"&v="+Date.now());
  $("#messages").innerHTML="";
  (d.messages||[]).forEach(renderMessage);scrollB();
}
async function send(){
  const t=$("#input").value.trim();if(!t||!agentId||streaming)return;
  $("#input").value="";streaming=true;updateComposer();
  renderMessage({role:"user",text:t});addTyping();showErr();
  try{
    const resp=await fetch("/api/chat-stream?v="+Date.now(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({agent:agentId,message:t})});
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf="";
    const fresh=[];let gotAny=false;
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n\n"))>=0){
        const block=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of block.split("\n")){
          if(line.startsWith("data:")){
            const data=line.slice(5).trim();if(!data||data==="{}")continue;
            let ev;try{ev=JSON.parse(data)}catch{continue}
            if(ev.messages){gotAny=true;fresh.length=0;fresh.push(...ev.messages)}
          }
        }
      }
      if(gotAny){rmTyping();renderFresh(fresh)}
      scrollB();
    }
    if(gotAny){rmTyping();renderFresh(fresh)}else{rmTyping();renderMessage({role:"assistant",text:"(no response)"})}
  }catch(e){
    // fetch/stream died (mobile "Load failed"): the agent may still be running
    // in the background. Give it a moment, then pull the latest messages so the
    // real answer surfaces instead of a dead error bubble.
    rmTyping();
    try{
      await new Promise(r=>setTimeout(r,3000));
      const d=await j("/api/messages?agent="+encodeURIComponent(agentId)+"&v="+Date.now());
      const msgs=d.messages||[];
      if(msgs.length>0){renderFresh(msgs)}
      else renderMessage({role:"assistant",text:"⚠ Connection dropped ("+e.message+"). Try again."});
    }catch(e2){renderMessage({role:"assistant",text:"⚠ "+e2.message})}
  }
  streaming=false;updateComposer();loadAgents(false);
}
function renderFresh(msgs){
  const all=[...$("#messages").querySelectorAll(".msg")];
  const userCount=[...$("#messages").querySelectorAll(".msg.user")].length;
  const toRemove=Math.max(0,all.length-userCount);
  for(let k=0;k<toRemove;k++)all[all.length-1-k].remove();
  msgs.forEach(renderMessage);
}

// ---------- MODEL PICKER ----------
async function openModelPicker(){
  if(!agentId)return;
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML='<div class="modal"><div class="mhead"><h3>Choose model</h3><button class="mclose">×</button></div><div class="mbody"><input class="search" placeholder="Search models…" autofocus><div class="mlist"><div class="empty">Loading models…</div></div><button class="btn" style="width:100%">Done</button></div></div>';
  document.body.appendChild(ov);
  const modal=ov.querySelector(".modal");
  ov.onclick=()=>ov.remove();modal.onclick=e=>e.stopPropagation();
  ov.querySelector(".mclose").onclick=()=>ov.remove();
  ov.querySelector(".btn").onclick=()=>ov.remove();
  const search=ov.querySelector(".search");
  const list=ov.querySelector(".mlist");
  let models=[];
  try{
    const d=await j("/api/models?agent="+encodeURIComponent(agentId)+"&v="+Date.now());
    models=(d.catalog&&d.catalog.models)||[];
  }catch(e){list.innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}
  function groupBy(q){
    const qq=q.toLowerCase();const map=new Map();
    models.forEach(m=>{if(qq&&!((m.name||"")+" "+(m.id||"")+" "+(m.provider||"")).toLowerCase().includes(qq))return;const prov=m.provider||m.api||"models";if(!map.has(prov))map.set(prov,[]);map.get(prov).push(m)});
    return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  }
  function ctx(m){const cw=m.contextWindow;if(!cw)return null;if(cw>=1e6)return Math.round(cw/1e6)+"M";if(cw>=1000)return Math.round(cw/1000)+"k";return String(cw)}
  function render(q){
    const groups=groupBy(q);list.innerHTML="";
    if(!groups.length){list.innerHTML='<div class="empty">No models available for this session.</div>';return}
    groups.forEach(([prov,arr])=>{
      const g=document.createElement("div");g.className="mgroup";
      g.innerHTML='<div class="mglabel">'+escapeHtml(prov)+'</div>';
      arr.forEach(m=>{
        const sel=currentModel===(m.name||m.id)||(m.id&&currentModel.includes(m.id));
        const row=document.createElement("div");row.className="mitem"+(sel?" sel":"");
        let meta="";
        if(m.reasoning)meta+='<span class="badge reasoning">reasoning</span>';
        if((m.cost&&m.cost.input===0&&m.cost.output===0)||(m.id||"").includes(":free"))meta+='<span class="badge free">free</span>';
        else if(m.cost&&m.cost.input!=null)meta+='<span class="badge ctx">$'+m.cost.input.toFixed(2)+'/1M in</span>';
        if(m.input&&m.input.length)meta+='<span class="badge ctx">'+escapeHtml(m.input.join("/"))+'</span>';
        const c=ctx(m);if(c)meta+='<span class="badge ctx">'+c+' ctx</span>';
        row.innerHTML='<div class="minfo"><div class="mname">'+escapeHtml(m.name||m.id)+'</div><div class="mmeta">'+meta+'</div></div>'+(sel?'<span class="checkmark">✓</span>':'');
        row.onclick=async()=>{try{
          await j("/api/set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({agent:agentId,key:"model",value:{provider:m.provider||m.api||"openrouter",modelId:m.id}})});
          currentModel=m.name||m.id;toast("Model set: "+(m.name||m.id));render(q);updateComposer();loadAgents(false);
        }catch(e){showErr(e.message)}};
        g.appendChild(row);
      });
      list.appendChild(g);
    });
  }
  search.oninput=()=>render(search.value);
  render("");
}

// ---------- MEMORY & SKILLS ----------
async function openMemory(){
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML='<div class="modal" style="max-width:640px"><div class="mhead"><h3>Memory &amp; Skills</h3><button class="mclose">×</button></div><div class="mbody">'+
    '<div class="ssection">Long-term memory</div>'+
    '<p style="font-size:11.5px;color:var(--faint);margin:4px 0 8px">Facts the agent persists across sessions. Edit and save, or the agent appends to it automatically.</p>'+
    '<textarea id="memText" style="width:100%;height:170px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;color:var(--txt);font-size:12.5px;padding:10px;font-family:ui-monospace,monospace;resize:vertical;outline:none" spellcheck="false"></textarea>'+
    '<div style="display:flex;gap:8px;margin-top:8px;align-items:center">'+
      '<button class="btn" id="memSave">Save memory</button>'+
      '<button class="btn" id="memAppend" title="Add a dated fact">+ Add fact</button>'+
      '<span class="spacer"></span><span id="memNote" class="savednote"></span>'+
    '</div>'+
    '<div class="ssection" style="margin-top:16px">Skills <small style="color:var(--faint);text-transform:none">(auto-loaded into the agent)</small></div>'+
    '<div id="skillList"></div>'+
    '<div style="margin-top:10px;border-top:1px solid var(--bd2);padding-top:10px">'+
      '<div class="srow"><div class="slabel"><span class="sname">New skill</span><span class="sdesc">Save a reusable procedure</span></div></div>'+
      '<div style="display:flex;flex-direction:column;gap:6px">'+
        '<input type="text" id="skName" placeholder="skill-name">'+
        '<input type="text" id="skDesc" placeholder="Short description">'+
        '<textarea id="skContent" style="width:100%;height:110px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;color:var(--txt);font-size:12.5px;padding:10px;font-family:ui-monospace,monospace;resize:vertical;outline:none" placeholder="Markdown instructions for the skill…"></textarea>'+
        '<button class="btn" id="skSave" style="align-self:flex-start">Save skill</button>'+
      '</div>'+
    '</div>'+
  '</div></div>';
  document.body.appendChild(ov);
  const modal=ov.querySelector(".modal");
  ov.onclick=()=>ov.remove();modal.onclick=e=>e.stopPropagation();
  ov.querySelector(".mclose").onclick=()=>ov.remove();
  const note=ov.querySelector("#memNote");
  async function refresh(){
    const d=await j("/api/memory");
    ov.querySelector("#memText").value=d.memory||"";
    const list=ov.querySelector("#skillList");list.innerHTML="";
    (d.skills||[]).forEach(s=>{
      const row=document.createElement("div");row.className="srow";
      row.innerHTML='<div class="slabel"><span class="sname">'+escapeHtml(s.name)+'</span><span class="sdesc">'+escapeHtml(s.description)+'</span></div>';
      const del=document.createElement("button");del.className="btn";del.textContent="Delete";del.style.fontSize="11px";del.style.padding="4px 9px";
      del.onclick=async()=>{if(!confirm("Delete skill "+s.name+"?"))return;await j("/api/skills/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:s.name})});refresh();toast("Deleted "+s.name)};
      row.appendChild(del);list.appendChild(row);
    });
    if(!d.skills||!d.skills.length)list.innerHTML='<div class="empty">No skills yet.</div>';
  }
  ov.querySelector("#memSave").onclick=async()=>{try{await j("/api/memory/write",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:ov.querySelector("#memText").value})});note.textContent="✓ Memory saved";toast("Memory saved")}catch(e){note.textContent="✗ "+e.message}};
  ov.querySelector("#memAppend").onclick=async()=>{const f=prompt("New fact to remember:");if(!f)return;try{await j("/api/memory/append",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fact:f})});note.textContent="✓ Fact added";toast("Fact added");refresh()}catch(e){note.textContent="✗ "+e.message}};
  ov.querySelector("#skSave").onclick=async()=>{const n=ov.querySelector("#skName").value.trim();const c=ov.querySelector("#skContent").value.trim();if(!n||!c){note.textContent="✗ name + content required";return}try{await j("/api/skills/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,description:ov.querySelector("#skDesc").value,content:c})});note.textContent="✓ Skill saved (auto-loads on next session)";toast("Skill saved");ov.querySelector("#skName").value="";ov.querySelector("#skDesc").value="";ov.querySelector("#skContent").value="";refresh()}catch(e){note.textContent="✗ "+e.message}};
  try{await refresh()}catch(e){showErr(e.message)}
}


async function openSettings(){
  if(!agentId)return;
  const caps=await j("/api/capabilities");
  let st=null;try{st=(await j("/api/state?agent="+encodeURIComponent(agentId))).state||null}catch(e){}
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML='<div class="modal"><div class="mhead"><h3>Settings</h3><button class="mclose">×</button></div><div class="mbody" id="sbody"></div></div>';
  document.body.appendChild(ov);
  const modal=ov.querySelector(".modal");
  ov.onclick=()=>ov.remove();modal.onclick=e=>e.stopPropagation();
  ov.querySelector(".mclose").onclick=()=>ov.remove();
  const body=ov.querySelector("#sbody");
  const note=document.createElement("div");note.className="savednote";
  function field(key,label,desc,val,opts){
    const row=document.createElement("div");row.className="srow";
    let ctrl;
    if(opts){ctrl=document.createElement("select");ctrl.className="sselect";opts.forEach(o=>{const opt=document.createElement("option");opt.value=o===null?"auto":o;opt.textContent=o===null?"auto":o;ctrl.appendChild(opt)});ctrl.value=val===null?"auto":val;ctrl.onchange=()=>save(key,ctrl.value)}
    else if(typeof val==="boolean"){ctrl=document.createElement("label");ctrl.className="toggle";ctrl.innerHTML='<input type="checkbox"'+(val?' checked':'')+'><span class="sl"></span>';ctrl.onclick=e=>{e.preventDefault();const inp=ctrl.querySelector("input");inp.checked=!inp.checked;save(key,inp.checked)}}
    else{ctrl=document.createElement("input");ctrl.type="number";ctrl.value=val;ctrl.onchange=()=>save(key,Number(ctrl.value))}
    row.innerHTML='<div class="slabel"><span class="sname">'+label+'</span><span class="sdesc">'+desc+'</span></div>';
    row.appendChild(ctrl);body.appendChild(row);
  }
  async function save(key,value){
    try{await j("/api/set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({agent:agentId,key,value})});note.textContent="✓ Saved ("+key+")";const s2=(await j("/api/state?agent="+encodeURIComponent(agentId))).state;if(s2){st=s2;sync()}}
    catch(e){note.textContent="✗ "+e.message}
  }
  function sync(){}
  const sec1=document.createElement("div");sec1.innerHTML='<div class="ssection">Agent capabilities</div>';body.appendChild(sec1);
  field("thinking","Thinking level","Reasoning effort: off (no chain-of-thought) → max (deepest).",st?st.thinkingLevel:"off",caps.thinkingLevels);
  field("serviceTier","Service tier","API service tier (auto lets the model decide).",st?st.serviceTier:"auto",caps.serviceTiers);
  field("transport","Transport","Streaming transport to the model provider.",st?st.transport:"sse",caps.transports);
  const sec2=document.createElement("div");sec2.innerHTML='<div class="ssection">Queueing</div>';body.appendChild(sec2);
  field("steeringMode","Steering mode","How queued steering messages are consumed.",st?st.steeringMode:"all",caps.queueModes);
  field("followUpMode","Follow-up mode","How follow-ups queue while the agent is busy.",st?st.followUpMode:"all",caps.queueModes);
  const sec3=document.createElement("div");sec3.innerHTML='<div class="ssection">Automation</div>';body.appendChild(sec3);
  field("autoCompaction","Auto-compaction","Compact the conversation when context fills up.",!!(st&&st.autoCompaction));
  field("autoRetry","Auto-retry","Retry transient provider/network failures.",!!(st&&st.autoRetry));
  field("rlmDepth","RLM max depth","Max depth for recursive agentic sub-tasks.",st?(st.rlmDepth||0):0);
  body.appendChild(note);
}

$("#newBtn").onclick=async()=>{try{await j("/api/new-session",{method:"POST",body:"{}"});await loadAgents(true);await loadMessages()}catch(e){showErr(e.message)}};
$("#agentSel").onchange=()=>{agentId=$("#agentSel").value;loadMessages()};
$("#sendBtn").onclick=send;
$("#modelBtn").onclick=openModelPicker;
$("#gearBtn").onclick=openSettings;
$("#memBtn").onclick=openMemory;
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#input").addEventListener("input",()=>{const t=$("#input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"});
(async function init(){
  try{await loadAgents(false);await loadMessages();}catch(e){showErr("Bridge unreachable: "+e.message)}
})();
</script>
</body>
